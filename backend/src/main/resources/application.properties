# ========================
# Server Configuration
# ========================
server.port=8080

# ========================
# H2 Database Configuration
# ========================
spring.datasource.url=jdbc:h2:file:./data/cloudsecurity
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# File Upload Configuration
# ========================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=./encrypted-files

# ========================
# JWT Configuration
# ========================
jwt.secret=CloudSecurityHybridEncryptionProjectSecretKeyForJWTTokenGeneration2024!@#
jwt.expiration-ms=86400000

# ========================
# Server RSA Key Configuration
# ========================
server.rsa.keystore-path=./keystore/server-keys.p12
server.rsa.keystore-password=serverKeystorePass123
server.rsa.key-alias=server-rsa-key
